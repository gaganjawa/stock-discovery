name: stock-discovery-chartink
services:
  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: chartink_inbox
      POSTGRES_USER: chartink_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [inbox:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chartink_owner -d chartink_inbox']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: {driver: local, options: {max-size: 10m, max-file: '3'}}
  migrate:
    profiles: [setup]
    build: {context: ../.., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL_FILE: /run/secrets/owner_url
    secrets: [owner_url]
    command: [python, -m, alembic, -c, /app/backend/alembic.ini, upgrade, head]
    networks: [private]
    depends_on: {database: {condition: service_healthy}}
  receiver:
    profiles: [receiver]
    build: {context: ../.., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL_FILE: /run/secrets/receiver_url
      CHARTINK_RECEIVER_ENABLED: ${CHARTINK_RECEIVER_ENABLED:-false}
      CHARTINK_WEBHOOK_SECRET_FILE: /run/secrets/webhook
      CHARTINK_PULL_SECRET_FILE: /run/secrets/pull
      CHARTINK_SCANNER_CONFIG: /run/secrets/scanner
    secrets: [receiver_url, webhook, pull, scanner]
    command: [uvicorn, app.chartink_receiver:app, --host, 0.0.0.0, --port, '8098', --no-access-log, --no-proxy-headers, --limit-concurrency, '20']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    depends_on: {database: {condition: service_healthy}}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: none}
  proxy:
    profiles: [receiver]
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment: {RECEIVER_DOMAIN: '${RECEIVER_DOMAIN:?Set the approved receiver DNS name}'}
    ports: ['443:443', '80:80']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'tls:/data', 'proxy_config:/config']
    networks: [private, edge]
    depends_on: {receiver: {condition: service_healthy}}
    restart: unless-stopped
    logging: {driver: none}
networks:
  private: {internal: true}
  edge: {}
volumes:
  inbox: {}
  tls: {}
  proxy_config: {}
secrets:
  db_password: {file: '${CHARTINK_SECRETS_DIR:?Set private secret directory}/db_password'}
  owner_url: {file: '${CHARTINK_SECRETS_DIR}/owner_url'}
  receiver_url: {file: '${CHARTINK_SECRETS_DIR}/receiver_url'}
  webhook: {file: '${CHARTINK_SECRETS_DIR}/webhook'}
  pull: {file: '${CHARTINK_SECRETS_DIR}/pull'}
  scanner: {file: '${CHARTINK_SECRETS_DIR}/scanner.json'}
