services:
  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-stock_discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock_discovery}:${POSTGRES_PASSWORD:-change-me-for-local-use}@database:5432/${POSTGRES_DB:-stock_discovery}
    command: ["python", "-m", "alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock_discovery}:${POSTGRES_PASSWORD:-change-me-for-local-use}@database:5432/${POSTGRES_DB:-stock_discovery}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:5173}
      CODE_VERSION: ${CODE_VERSION:-local-unversioned}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock_discovery}:${POSTGRES_PASSWORD:-change-me-for-local-use}@database:5432/${POSTGRES_DB:-stock_discovery}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api
