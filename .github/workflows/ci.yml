name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: backend:shared:worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Python packages
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Validate contracts and application
        run: |
          python scripts/validate_contract_examples.py
          python scripts/validate_evaluation_examples.py
          python scripts/validate_capital_risk_examples.py
          python -m pytest backend/tests worker/tests --ignore=backend/tests/integration -q
          python -m worker.main --once
          python -m unittest discover -s scripts -p "test_*.py"
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STK_TEST_DATABASE_URL: postgresql://stock_discovery:change-me-for-local-use@127.0.0.1:5432/stk013_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Python packages
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Verify migrations and all database integration tests
        run: |
          docker compose up -d --wait database
          docker compose exec -T database createdb -U stock_discovery stk013_test
          python scripts/validate_migrations.py
      - name: Database diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100 database
      - name: Stop disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_TOKEN: ci-synthetic-test-access-key-no-real-account
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://127.0.0.1:5173
      CODE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Python packages
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI from lockfile
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build and run local stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
          python scripts/smoke_compose.py
      - name: Capture Linux AMD64 runtime licence evidence
        run: python scripts/capture_platform_licenses.py evidence/linux-amd64-licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-licenses
          path: evidence/linux-amd64-licenses.json
          retention-days: 30
      - name: Browser workflow acceptance
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
  checks:
    if: ${{ always() }}
    needs: [unit, postgres, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory validation gate
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$UI_RESULT" = success
