name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python packages
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Validate contracts and application
        env:
          PYTHONPATH: backend:shared:worker
        run: |
          python scripts/validate_contract_examples.py
          python scripts/validate_evaluation_examples.py
          python scripts/validate_capital_risk_examples.py
          python -m pytest backend/tests worker/tests -q
          python -m worker.main --once
          python -m unittest discover -s scripts -p "test_smoke_compose.py"
      - name: Build UI from lockfile
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build and run local stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
          python scripts/smoke_compose.py
      - name: Verify migrations in disposable PostgreSQL database
        env:
          STK_TEST_DATABASE_URL: postgresql://stock_discovery:change-me-for-local-use@127.0.0.1:5432/stk013_test
        run: |
          docker compose exec -T database createdb -U stock_discovery stk013_test
          python scripts/validate_migrations.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
